<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGl2 Test</title>
  <style>
    body {
      margin: 0;
    }
    
    canvas {
      display: block;  /* prevents scrollbar */
      width: 100vw;
      height: 100vh;
    }
    #uiContainer{
      position: absolute;
      top: 0;
      left: 85rem;
    }
  </style>
</head>
<body>
   <canvas id="c"></canvas>
    <div id="uiContainer">
      <div id="position">
        <p>Positions: </p>
        <p id="posx">X: <span id="x"></span></p>
        <p id="posy">Y: <span id="y"></span></p>
        <p id="posz">Z: <span id="z"></span></p>
      </div>
    </div>
   <script type="module" src="main.js"></script>
   <script src="gl-matrix-min.js"></script>
   <script src="./dist/gl-matrix.js"></script>
</body>
</html>
